<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Template for the "What we do" hub (/what-we-do) and every wing page
         (/quizzes, /circles, …). seo.config.js fills the per-page <head> tags and the
         crawlable #seo-fallback content, and writes one copy per page to dist/<slug>.html. -->
    <script>document.documentElement.classList.add('js')</script>
    <style>.js #seo-fallback{display:none}</style>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,700;1,400;1,700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,700;1,400;1,700&display=swap" /></noscript>
    <meta name="theme-color" content="#382525" />
    <!--seo-head-->
  </head>
  <body>
    <div id="root"><!--seo-fallback--></div>
    <script type="module" src="/src/wing/main.jsx"></script>
  </body>
</html>
